name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: Remove any personal data (address, bank account, …) before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Bun 1.1.30"
    validations:
      required: true
